name: Keep Supabase Alive

on:
  schedule:
    # Runs every 2 days at midnight UTC to prevent Supabase 7-day inactivity pause
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent project pause
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_RcT5Xp4YQgQncpBaz1COpQ_qels9qg_' }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://deohomcyxxnhfxfmnriq.supabase.co/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY")
          echo "Supabase Query Status: $HTTP_CODE"
          if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 206 ]; then
            echo "Database successfully queried and kept active!"
          else
            echo "Warning: Received HTTP $HTTP_CODE from Supabase."
          fi